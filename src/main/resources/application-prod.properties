
spring.datasource.url = ${DB_URL}
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto = update

jwt.secret = ${JWT_SECRET}
jwt.expirationInSec = 1864000
jwt.refreshExpirationInSec = 864000

app.firebase-configuration-file = ${FIREBASE_FILE_PATH}

spring.data.redis.host = ${REDIS_HOST}
spring.data.redis.port = ${REDIS_PORT}

#File uploads
file.upload-dir= ${FILE_UPLOAD_PATH}
spring.servlet.multipart.max-file-size= ${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size= ${MAX_REQUEST_SIZE}